# FPGA CI for the Mole project.
#
# Two parallel jobs:
#
#   sim   --- runs every Mole sub-block simulation. Catches the
#             class of bugs that only show up when the toolchain
#             (sbt + Verilator + SpinalHDL) is actually invoked:
#             type errors, scalafmt drift, RTL/sim races, CRLF
#             creep.
#
#   synth --- runs `make all`: SpinalHDL elaboration -> yosys
#             synth -> nextpnr-ice40 P&R -> icepack. The point of
#             this job is to catch the class of bugs that
#             Verilator does *not* model: timing closure regressions
#             and resource overruns on the UP5K. nextpnr-ice40
#             exits non-zero when the routed design fails its
#             clock constraint, so a regression below 24 MHz fails
#             CI loudly.
#
# What this workflow does NOT do:
#   - run hardware bring-up (obviously).
#   - publish artifacts. On failure, the assertion message from
#     the failing sim, or nextpnr's critical-path report from the
#     synth log, is the diagnostic. Revisit if the noise grows.

name: fpga-sim

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sim:
    name: SpinalHDL sims (sbt + Verilator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # AGENTS.md §3.1 / §4: every text file in this repo is LF
      # only. CRLF in source produces whole-file diffs that drown
      # out real changes, and CRLF in shell scripts / makefiles
      # silently breaks them. Fail loudly if any creep in.
      - name: CRLF guard
        run: |
          set -eu
          # Restrict to text-file extensions to avoid noise from
          # any future binary artefact a contributor commits by
          # accident. List is intentionally narrow --- expand as
          # new source-file kinds appear in the repo.
          offenders=$(find fpga/Mole .github -type f \
            \( -name '*.scala' -o -name '*.sbt' -o -name '*.yml' \
            -o -name '*.yaml' -o -name '*.md' -o -name '*.conf' \
            -o -name '*.pcf' -o -name '*.properties' \
            -o -name 'Makefile' \) -print0 \
            | xargs -0 grep -lP '\r' || true)
          if [ -n "$offenders" ]; then
            echo "::error::CRLF line endings found --- run dos2unix on the listed files:"
            echo "$offenders"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Built-in sbt cache: ~/.sbt, ~/.ivy2/cache, ~/.cache/coursier
          # keyed on **/*.sbt and **/project/build.properties. Warm
          # runs drop the sbt bootstrap from ~3 min to ~30 s.
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      # Verilator is installed from Ubuntu apt rather than from
      # YosysHQ oss-cad-suite. Why:
      #
      #   - oss-cad-suite 2026-05-26 ships Verilator 5.049-devel
      #     (rev v5.048-132-ga2d4b90b5), which dropped the `WData`
      #     type in upstream PR #7642 (merged 2026-05-22) in favour
      #     of `VlWide` / `VlWide4AB`.
      #   - SpinalHDL 1.14.1's generated `__spinalWrapper.cpp` still
      #     emits `WData` references, so its C++ model fails to
      #     compile against any Verilator at or above that cutoff.
      #     Tracked upstream as SpinalHDL issue #1919.
      #   - Ubuntu 24.04 noble ships Verilator 5.020 (apt), which
      #     predates the cutoff and is well-tested with SpinalHDL
      #     1.14.1.
      #
      # `make sim` only needs Verilator + g++ + JDK + sbt --- it
      # does not need yosys / nextpnr / icestorm. When Step 15
      # lands `MoleTopVerilog` and we add a `make all` synth job,
      # bring oss-cad-suite back as a separate job so the
      # sim-toolchain and synth-toolchain decisions stay
      # independent. Revisit this apt pin once SpinalHDL #1919 is
      # fixed and the project bumps SpinalHDL.
      - name: Install Verilator
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator

      - name: Verify toolchain
        working-directory: fpga/Mole
        run: |
          set -eu
          java -version
          sbt --version
          verilator --version
          g++ --version

      # scalafmt drift is cheap to catch and worthless to debug
      # later when a refactor diff is buried in formatting noise.
      - name: Check formatting (scalafmt)
        working-directory: fpga/Mole
        run: sbt -batch scalafmtCheckAll

      # Catches Scala type errors before any sim is even compiled
      # to C++ by Verilator --- much faster failure signal.
      - name: Compile Scala
        working-directory: fpga/Mole
        run: sbt -batch compile

      # The main event: every Phase-0 sub-block sim, end to end.
      # `make sim` aggregates all 12 current targets.
      - name: Run all simulations
        working-directory: fpga/Mole
        run: make sim

  synth:
    name: iCE40 synth + P&R (yosys + nextpnr + icestorm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Same sbt cache as the sim job. The two jobs share a
          # cache key by virtue of identical **/*.sbt +
          # **/project/build.properties contents.
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      # Synth toolchain is installed from Ubuntu apt rather than
      # YosysHQ oss-cad-suite for the same reason the sim job pins
      # Verilator from apt: pinning to a distro-supplied version
      # gives reproducible CI without depending on the moving
      # head of oss-cad-suite.
      #
      # Ubuntu 24.04 noble ships:
      #   - yosys           0.36 (apt)
      #   - nextpnr-ice40   0.6  (apt)
      #   - fpga-icestorm   2024 (apt, provides icepack)
      #
      # All three are recent enough to handle the UP5K and the
      # current Mole netlist. If a future Spinal/yosys interaction
      # forces a newer toolchain version, switch this job to
      # oss-cad-suite at that point and document the trigger.
      - name: Install yosys + nextpnr-ice40 + icestorm
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            yosys nextpnr-ice40 fpga-icestorm

      - name: Verify toolchain
        working-directory: fpga/Mole
        run: |
          set -eu
          java -version
          sbt --version
          yosys -V
          nextpnr-ice40 --version

      # `make all` chains: SpinalHDL elaboration ->
      # yosys synth_ice40 -> nextpnr-ice40 (with --freq 24) ->
      # icepack. nextpnr exits non-zero when the routed design
      # fails its clock constraint, so any timing-closure
      # regression below 24 MHz fails this job loudly --- which
      # is the entire point of having a synth job in CI.
      - name: Build bitstream (make all)
        working-directory: fpga/Mole
        run: make all
