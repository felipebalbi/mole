[book]
title = "The moleasm Tutorial"
authors = ["Felipe Balbi"]
description = "Tutorial and reference for moleasm, the Layer-1 assembly language of the Mole I3C/I2C compliance rig."
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/felipebalbi/mole"
